name: Release

# Release automático: a cada push na main, o semantic-release analisa os commits
# (Conventional Commits), calcula a versão, gera o CHANGELOG, empacota a extensão
# e publica o GitHub Release. A validação (lint/testes) já rodou no CI do PR.
# O commit de release usa [skip ci].
on:
  push:
    branches: [main]

permissions:
  contents: write        # criar tag/release e commitar o CHANGELOG/metadata
  issues: write          # comentários do semantic-release
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Evita loop: o commit de release ("chore(release): … [skip ci]") não dispara.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # semantic-release precisa do histórico completo
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # gjs/GLib/zip são usados pelo prepareCmd (build-zip.sh) durante o release.
      - name: Instalar ferramentas de empacotamento
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin zip

      - name: Instalar dependências
        run: npm install

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
