name: Release

# Release automático (semantic-release): a cada push na main, analisa os commits
# (Conventional Commits), calcula a próxima versão, gera o CHANGELOG, empacota a
# extensão e publica o GitHub Release. O commit de release usa [skip ci].
on:
  push:
    branches: [main]

permissions:
  contents: write        # criar tag/release e commitar o CHANGELOG/metadata
  issues: write          # comentários do semantic-release
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Evita loop: o commit de release ("chore(release): … [skip ci]") não dispara.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # semantic-release precisa do histórico completo
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar gjs e ferramentas do GLib
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin zip

      - name: Instalar dependências
        run: npm install

      # Portão de qualidade antes de liberar: mesmos checks do CI.
      - name: Testes de lógica (gjs)
        run: npm test

      - name: Lint (ESLint)
        run: npm run lint

      - name: Validar metadata.json
        run: node .github/scripts/check-metadata.mjs

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
