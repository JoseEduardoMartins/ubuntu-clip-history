name: CI

# Checks de Pull Request: instala deps, lint, testes e validações. O release
# (semantic-release) roda separado, no release.yml, só após o merge na main.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar gjs e ferramentas do GLib
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin

      - name: Instalar dependências
        run: npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes de lógica (gjs)
        run: npm test

      - name: Validar o schema de configurações
        run: glib-compile-schemas --strict --dry-run extension/schemas

      - name: Validar metadata.json
        run: node .github/scripts/check-metadata.mjs

      - name: Syntax-check de todos os .js da extensão
        run: |
          fail=0
          while IFS= read -r f; do
            if node --check "$f"; then
              echo "ok   - $f"
            else
              echo "FAIL - $f"
              fail=1
            fi
          done < <(find extension -name '*.js')
          exit $fail
